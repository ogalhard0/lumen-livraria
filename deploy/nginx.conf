# Proxy reverso: HTTPS (TLS) é terminado aqui ou na Cloudflare. Para TLS próprio, use certificados Let's Encrypt (certbot).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

upstream web { server web:3000; }
upstream api { server api:3001; }

server {
    listen 80;
    server_name _;
    client_max_body_size 3m;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Em produção, com HTTPS ativo, descomente:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api;
    }
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api;
    }
    location /uploads/ {
        proxy_pass http://api;
        expires 7d;
    }
    location / {
        proxy_pass http://web;
    }
}
